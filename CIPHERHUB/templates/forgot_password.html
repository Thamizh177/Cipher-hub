<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='forgotStyle.css') }}">
    <title>Forgot Password</title>
</head>

<body>
    <div class="box">
        <div class="flip-card-inner">
            <div class="box-forgot-password">
                <form action="/forgot-password" method="post">
                    <h1>FORGOT PASSWORD</h1>
                    <div class="input-icon">
                        <input class="inpt" type="email" name="email" placeholder="Email" required>
                        <i class="fa fa-envelope"></i>
                    </div>
                    <button type="submit" class="btn">Submit</button>
                </form>
            </div>

            <div class="box-verify-otp">
                <form action="/forgot-password" method="post">
                    
                    <div class="input-icon">
                        <input class="inpt" type="text" name="otp" placeholder="Enter OTP" required>
                        <i class="fa fa-key"></i>
                    </div>
                    <input type="hidden" name="email" value="{{ email }}">
                    <button type="submit" class="btn">Validate OTP</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
