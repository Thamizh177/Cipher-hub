<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='forgotStyle.css') }}">
    <title>Reset Password</title>
</head>

<body>
    <div class="box">
        <div class="box-reset-password">
            <form action="/reset-password" method="post">
                <h1>RESET PASSWORD</h1>
                <div class="input-icon">
                    <input class="inpt" type="password" name="new_password" placeholder="New Password" required>
                    <i id="eye-reset-new" class="fa fa-eye-slash" onclick="togglePassword('eye-reset-new', 'new_password')"></i>
                </div>
                <div class="input-icon">
                    <input class="inpt" type="password" name="confirm_password" placeholder="Confirm Password" required>
                    <i id="eye-reset-confirm" class="fa fa-eye-slash" onclick="togglePassword('eye-reset-confirm', 'confirm_password')"></i>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(eyeId, inputType) {
            const eyeIcon = document.getElementById(eyeId);
            const inputField = eyeIcon.previousElementSibling;

            if (inputField.type === "password") {
                inputField.type = "text";
                eyeIcon.className = "fa fa-eye";
            } else {
                inputField.type = "password";
                eyeIcon.className = "fa fa-eye-slash";
            }
        }
    </script>
</body>

</html>
